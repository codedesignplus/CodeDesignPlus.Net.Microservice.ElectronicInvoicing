name: Continuous Integration

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - rc
      - dev
      - feature/*
 
permissions:
  contents: write
  packages: write
  repository-projects: write

jobs:
  build:
    uses: codedesignplus/workflows/.github/workflows/build-microservice.yaml@main
    with:
      project-name: CodeDesignPlus.Net.Microservice.ElectronicInvoicing
      microservice-name: ms-electronicinvoicing
      environment: Development
    secrets: inherit
  
  # SonarQube stays out for now: the CI runs the build and the guardrails first. The job is commented out, not
  # deleted, so it does not have to be written again.
  # sonarqube:
  #   needs: build
  #   if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rc' || github.ref == 'refs/heads/dev' }}
  #   uses: codedesignplus/workflows/.github/workflows/sonarqube.yaml@main
  #   with:
  #     project-name: CodeDesignPlus.Net.Microservice.ElectronicInvoicing
  #     microservice-name: ms-electronicinvoicing
  #     environment: Development
  #   secrets: inherit

  money-guardrails:
    uses: codedesignplus/workflows/.github/workflows/money-guardrails.yaml@main
    with:
      runner: ubuntu-latest
    secrets: inherit
